<!DOCTYPE html>
<html lang="ro">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pagina nu există — Tudor Mirca</title>
  <meta name="robots" content="noindex">
  <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px;
      background: #050507; color: #f4f5f8; font: 500 17px/1.55 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    main { max-width: 560px; }
    p.tc { color: #ff6b2c; font: 500 0.8rem/1 ui-monospace, Menlo, Consolas, monospace; letter-spacing: 0.16em; text-transform: uppercase; }
    h1 { margin: 14px 0 12px; font-size: clamp(2.4rem, 8vw, 4rem); line-height: 1; letter-spacing: -0.04em; }
    p { color: #9ca2b0; }
    nav { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 26px; }
    a { display: inline-flex; align-items: center; min-height: 46px; padding: 0 20px; border-radius: 999px;
      background: rgba(255,255,255,0.06); box-shadow: inset 0 0 0 1px rgba(255,255,255,0.12); color: inherit; font-weight: 600; text-decoration: none; }
    a:first-child { background: #ff6b2c; box-shadow: none; color: #1a0800; }
  </style>
</head>
<body>
  <main>
    <p class="tc">404 · cadru lipsă</p>
    <h1>Pagina asta nu există.</h1>
    <p>Poate adresa are o greșeală sau pagina a fost mutată.</p>
    <nav>
      <a href="/">Prima pagină</a>
      <a href="/16voci16zile/">16 Zile. 16 Voci.</a>
    </nav>
  </main>
</body>
</html>
